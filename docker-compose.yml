# One command: docker compose up --build
# Every value has a default, so a fresh clone needs no .env file.
# Override host ports with APP_PORT / DB_PORT if 8080 or 55432 are taken.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: paisa
      POSTGRES_DB: paisa
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisa -d paisa"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://paisa:paisa@db:5432/paisa?sslmode=disable
      DB_MAX_CONNS: "10"
      PORT: "8080"
      APP_ENV: local
      ADMIN_TOKEN: local-dev-admin-token-do-not-deploy
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
